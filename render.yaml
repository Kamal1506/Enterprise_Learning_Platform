envVarGroups:
  - name: skillsphere-env
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SKILL_SERVICE_URL
        value: "https://skillsphere-skill-service.onrender.com/api/v1"
      - key: LEARNING_SERVICE_URL
        value: "https://skillsphere-learning-service.onrender.com/api/v1"
      - key: CERTIFICATION_SERVICE_URL
        value: "https://skillsphere-cert-service.onrender.com/api/v1"
      - key: CAREER_SERVICE_URL
        value: "https://skillsphere-career-service.onrender.com/api/v1"

services:
  # 1. Skill Service
  - type: web
    name: skillsphere-skill-service
    runtime: docker
    rootDir: services/skill-service
    plan: free
    envVars:
      - fromGroup: skillsphere-env

  # 2. Learning Service
  - type: web
    name: skillsphere-learning-service
    runtime: docker
    rootDir: services/learning-service
    plan: free
    envVars:
      - fromGroup: skillsphere-env

  # 3. Certification Service
  - type: web
    name: skillsphere-cert-service
    runtime: docker
    rootDir: services/certification-service
    plan: free
    envVars:
      - fromGroup: skillsphere-env

  # 4. Career Service
  - type: web
    name: skillsphere-career-service
    runtime: docker
    rootDir: services/career-service
    plan: free
    envVars:
      - fromGroup: skillsphere-env

  # 5. Assistant Service
  - type: web
    name: skillsphere-assistant-service
    runtime: docker
    rootDir: services/assistant-service
    plan: free
    envVars:
      - fromGroup: skillsphere-env
