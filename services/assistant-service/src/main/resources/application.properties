server.port=${PORT:8085}

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillsphere_nexus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kamal1717}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=assistant_service
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=assistant_service
spring.flyway.create-schemas=true
spring.flyway.placeholder-replacement=false
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:9a6747f5e5b74c2e8b2b7b5c6e8f0a2d3c4b5a6d7e8f901234567890abcdef12}

# LLM / Groq API Configuration
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.key=${GROQ_API_KEY:gsk_placeholder_value}
groq.api.model=openai/gpt-oss-120b

# Assistant Config
assistant.chat.max-history=10
assistant.chat.rate-limit.requests=20
assistant.chat.rate-limit.duration-ms=60000

# Service URL Configurations
skill.service.url=${SKILL_SERVICE_URL:http://localhost:8081/api/v1}
learning.service.url=${LEARNING_SERVICE_URL:http://localhost:8082/api/v1}
certification.service.url=${CERTIFICATION_SERVICE_URL:http://localhost:8083/api/v1}
career.service.url=${CAREER_SERVICE_URL:http://localhost:8084/api/v1}
