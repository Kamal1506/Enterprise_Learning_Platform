server.port=${PORT:8083}

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillsphere_nexus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kamal1717}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=cert_service
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=cert_service
spring.flyway.create-schemas=true
spring.flyway.placeholder-replacement=false
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:9a6747f5e5b74c2e8b2b7b5c6e8f0a2d3c4b5a6d7e8f901234567890abcdef12}

# Skill Service Integration
skill.service.url=${SKILL_SERVICE_URL:http://localhost:8081/api/v1}

# Expiry Scheduler Cron Configuration (runs daily at midnight)
certification.expiry.scheduler.cron=0 0 0 * * ?
